name: CI/CD - Build and Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            # Extract version from tag (e.g., refs/tags/v1.0.0 -> 1.0.0)
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_PRERELEASE=$(echo "$VERSION" | grep -qE '-(alpha|beta|rc|preview|dev)' && echo "true" || echo "false")
          else
            # Use default version from project file for builds and PRs
            VERSION="1.0.0-ci"
            IS_PRERELEASE="true"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Determined version: ${VERSION} (prerelease: ${IS_PRERELEASE})"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release /p:Version=${{ steps.version.outputs.version }}

      - name: Run Tests
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 30

      - name: Pack NuGet Packages
        if: github.event_name == 'push'
        run: dotnet pack -c Release --no-build -o ./artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Upload NuGet Packages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 90

      - name: Upload Symbol Packages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: symbol-packages
          path: ./artifacts/*.snupkg
          retention-days: 90

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: nuget-production
    permissions:
      contents: read
    steps:
      - name: Download NuGet Packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Download Symbol Packages
        uses: actions/download-artifact@v4
        with:
          name: symbol-packages
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Packages
        run: |
          echo "Found packages:"
          ls -lh ./artifacts/*.nupkg
          echo "Found symbols:"
          ls -lh ./artifacts/*.snupkg || echo "No symbol packages found"

      - name: Push to NuGet.org
        run: |
          for package in ./artifacts/*.nupkg; do
            echo "Publishing $package"
            dotnet nuget push "$package" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Push Symbols to NuGet.org
        run: |
          for symbols in ./artifacts/*.snupkg; do
            echo "Publishing $symbols"
            dotnet nuget push "$symbols" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.build.outputs.version }}
          body: |
            ## Release ${{ needs.build.outputs.version }}
            
            ### NuGet Packages
            The packages are now available on NuGet.org:
            - `Guardhouse.SDK` ${{ needs.build.outputs.version }}
            
            ### Installation
            ```bash
            dotnet add package Guardhouse.SDK --version ${{ needs.build.outputs.version }}
            ```
            
            For detailed information, see the [CHANGELOG](https://github.com/legiosoft/guardhouse-sdk-dotnet/blob/main/CHANGELOG.md).
          draft: false
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          files: |
            ./artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
