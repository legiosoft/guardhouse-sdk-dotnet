name: CI / CD

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
      - develop
    paths-ignore:
      - '**/*.md'
      - '**/.gitignore'
      - 'LICENSE'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        
      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
           
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "version=1.0.0" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            echo "version=1.0.0-preview" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            echo "version=1.0.0-dev" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF_NAME#refs/tags/v/}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}
      
      - name: Run Tests
        run: dotnet test --no-build --logger "console;verbosity=detailed"
      
      - name: Pack
        run: dotnet pack --no-restore -c Release -p:Version=${{ steps.version.outputs.version }} --output nuget/
      
      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: src/nuget/
          if-no-files-found: error
  
  release:
    needs: build
    runs-on: ubuntu-latest
    name: Release to NuGet
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: true
          sparse-checkout-paths: src/nuget/
      
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: src/nuget/
      
      - name: List NuGet files
        working-directory: src/nuget
        run: ls -la
      
      - name: Publish to NuGet
        working-directory: src/nuget
        run: dotnet nuget push *.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols true
        env:
          GH_TOKEN: ${{ github.token }}
