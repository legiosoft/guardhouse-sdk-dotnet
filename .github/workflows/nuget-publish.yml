name: CI / CD

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
      - develop
    paths-ignore:
      - '**/*.md'
      - '**/.gitignore'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        
      - name: Restore
        run: dotnet restore
      
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "version=1.0.0" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            echo "version=1.0.0-preview" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            echo "version=1.0.0-dev" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#refs/tags/v/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}
      
      - name: Pack
        run: dotnet pack -c Release -p:Version=${{ steps.version.outputs.version }} -o nuget/
      
      - name: Run Tests
        run: dotnet test --no-build
      
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: src/nuget/

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: nuget
      
      - name: Push to NuGet
        run: dotnet nuget push *.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
