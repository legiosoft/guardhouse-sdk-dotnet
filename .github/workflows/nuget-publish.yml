name: CI / CD

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
      - develop
    paths-ignore:
      - '**/*.md'
      - '**/.gitignore'
      - 'LICENSE'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        
      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
           
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "version=1.0.0" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            echo "version=1.0.0-preview" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            echo "version=1.0.0-dev" >> $GITHUB_OUTPUT
          else
            VERSION=$(echo "${{ github.ref_name }}" | sed 's|refs/tags/v/||' | sed 's|^v||')
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi
          
      - name: Build
        run: dotnet build --no-restore -c Release /p:Version="${{ steps.version.outputs.version }}"
      
      - name: Run Tests
        run: dotnet test --no-build --logger "console;verbosity=detailed" --results-directory TestResults --collect:"XPlat Code Coverage"
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage.xml
          
      - name: Pack
        run: dotnet pack --no-restore --output nuget/ /p:Version="${{ steps.version.outputs.version }}"
      
      - name: List nuget directory
        run: ls -la nuget/
      
      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuget-package
          path: nuget/
  
  release:
    needs: build
    runs-on: ubuntu-latest
    name: Release to NuGet
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        run: |
          echo "Downloading artifact..."
          gh artifact download nuget-package --dir .
      - name: List downloaded files
        run: ls -la
      - name: Publish to NuGet
        run: dotnet nuget push *.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols true
        env:
          GH_TOKEN: ${{ github.token }}
